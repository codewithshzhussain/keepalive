name: Toolswala Keep-Alive

on:
  schedule:
    - cron: '3-59/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: toolswala-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node modules
        id: npm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package.json') }}

      - name: Cache Puppeteer's Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-chrome-${{ runner.os }}

      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm install

      - name: Run keep-alive check
        env:
          TOOLSWALA_USERNAME: ${{ secrets.TOOLSWALA_USERNAME }}
          TOOLSWALA_PASSWORD: ${{ secrets.TOOLSWALA_PASSWORD }}
        run: node keepalive.js

      - name: Save session for next run
        run: |
          git config user.name "toolswala-bot"
          git config user.email "bot@users.noreply.github.com"
          git add cookies.json
          git diff --cached --quiet || git commit -m "Update session"
          git pull --rebase
          git push
